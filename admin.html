<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Floty</title>
<script src="https://unpkg.com"></script>
<style>
body{font-family:sans-serif;background:#f1f5f9;margin:0;padding:15px}
.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;font-size:14px}
button{padding:10px 16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;background:#0f172a}
.card{border:1px solid #e2e8f0;border-left:5px solid #2563eb;padding:15px;border-radius:12px;margin-bottom:15px;background:#fff}
.chip{display:inline-block;padding:4px 8px;margin:2px;border-radius:6px;font-size:12px;background:#e2e8f0}
img{max-width:100%;max-height:250px;border-radius:8px;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>

<div id="login" class="box" style="max-width:340px;margin-top:60px;text-align:center">
  <h2>Panel Szefa</h2>
  <input type="password" id="pass" placeholder="Hasło (Flota2026)">
  <button onclick="zaloguj()" style="width:100%">Wejdź</button>
</div>

<div id="panel" class="box hide">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
    <h2 style="margin:0">🚛 Flota Gołaszewski</h2>
    <button onclick="pobierz()" style="background:#2563eb">🔄 Odśwież</button>
  </div>

  <div style="background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:20px;border:1px solid #e2e8f0">
    <b>➕ Dodaj zlecenie:</b>
    <input id="n-auto" placeholder="Nr auta (np. SCANIA 01)">
    <input id="n-opis" placeholder="Co trzeba zrobić?">
    <button onclick="dodaj()" style="background:#059669;width:100%">Dodaj</button>
  </div>

  <div id="lista">Ładowanie...</div>
</div>

<script>
const SB_URL = 'https://supabase.co';
const SB_KEY = 'sb_publishable_9gPLtYFR6NeElYZtIgC8ig_8vmZZB_t';
const db = window.supabase.createClient(SB_URL, SB_KEY);

function zaloguj() {
  if (document.getElementById('pass').value === 'Flota2026') {
    document.getElementById('login').classList.add('hide');
    document.getElementById('panel').classList.remove('hide');
    pobierz();
  } else alert('Złe hasło');
}

async function pobierz() {
  const el = document.getElementById('lista');
  el.innerHTML = 'Pobieranie z bazy...';
  try {
    const { data, error } = await db.from('zgloszenia').select('*').order('created_at', { ascending: false });
    if (error) { el.innerHTML = 'Błąd bazy: ' + error.message; return; }
    if (!data || !data.length) { el.innerHTML = 'Brak wpisów w bazie.'; return; }

    let out = '';
    for (let i = 0; i < data.length; i++) {
      const x = data[i];
      let chips = '';
      if (x.lista_kontrolna) {
        const arr = x.lista_kontrolna.split('\n');
        for (let j = 0; j < arr.length; j++) chips += '<span class="chip">' + arr[j] + '</span>';
        chips = '<div style="margin:8px 0">' + chips + '</div>';
      }
      const img = x.zdjecie ? '<div><img src="' + x.zdjecie + '"></div>' : '';
      out += '<div class="card">' +
        '<div style="display:flex;justify-content:space-between">' +
          '<b>' + x.auto + ' (' + (x.typ || 'Usterka') + ') – ' + x.kierowca + '</b>' +
          '<button onclick="usun(' + x.id + ')" style="background:#dc2626;padding:5px 10px">🗑️</button>' +
        '</div>' +
        '<small style="color:#64748b">' + new Date(x.created_at).toLocaleString('pl-PL') + '</small>' +
        chips + img +
        '<label style="font-size:12px;font-weight:bold;display:block;margin-top:8px">Uwagi kierowcy:</label>' +
        '<textarea id="o-' + x.id + '" rows="2">' + x.opis + '</textarea>' +
        '<label style="font-size:12px;font-weight:bold;color:#b45309">Uwagi szefa / dla mechaników:</label>' +
        '<textarea id="a-' + x.id + '" rows="2" style="background:#fffbeb">' + (x.uwagi_admina || '') + '</textarea>' +
        '<div style="display:flex;gap:8px">' +
          '<select onchange="status(' + x.id + ', this.value)">' +
            '<option ' + (x.status==='Do zrobienia'?'selected':'') + '>Do zrobienia</option>' +
            '<option ' + (x.status==='W trakcie'?'selected':'') + '>W trakcie</option>' +
            '<option ' + (x.status==='Gotowe'?'selected':'') + '>Gotowe</option>' +
          '</select>' +
          '<button onclick="zapisz(' + x.id + ')" style="background:#1e293b;white-space:nowrap">💾 Zapisz</button>' +
        '</div>' +
      '</div>';
    }
    el.innerHTML = out;
  } catch (e) {
    el.innerHTML = 'Błąd: ' + e.message;
  }
}

async function dodaj() {
  const auto = document.getElementById('n-auto').value.trim();
  const opis = document.getElementById('n-opis').value.trim();
  if (!auto || !opis) return alert('Wpisz auto i opis');
  await db.from('zgloszenia').insert([{ auto: auto, kierowca: 'SZEF', typ: 'Usterka', opis: opis }]);
  document.getElementById('n-auto').value = '';
  document.getElementById('n-opis').value = '';
  pobierz();
}

async function zapisz(id) {
  await db.from('zgloszenia').update({
    opis: document.getElementById('o-'+id).value,
    uwagi_admina: document.getElementById('a-'+id).value
  }).eq('id', id);
  alert('Zapisano!');
}

async function status(id, s) {
  await db.from('zgloszenia').update({ status: s }).eq('id', id);
}

async function usun(id) {
  if (confirm('Usunąć?')) { await db.from('zgloszenia').delete().eq('id', id); pobierz(); }
}
</script>
</body>
</html>
